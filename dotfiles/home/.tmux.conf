# =============================================================================
#  tmux — "Graphite"
#  Matches ~/.config/ghostty/config, ~/.config/starship.toml and fastfetch
#  Reload: prefix + r
# =============================================================================

# --- Terminal ----------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
# Let images/clipboard escapes pass through to the terminal.
set -g allow-passthrough on
set -g history-limit 20000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
setw -g mode-keys vi
setw -g automatic-rename on

# --- Status bar --------------------------------------------------------------
set -g status-interval 15
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=#8a909c,bg=#17181d"

set -g status-left-length 24
set -g status-left "#[fg=#17181d,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#17181d]"

set -g status-right-length 60
set -g status-right "#[fg=#5c6370]#{?client_prefix,#[fg=#f0cf8e]PREFIX ,}#[fg=#8a909c]%H:%M #[fg=#7aa2f7]#h "

setw -g window-status-separator " "
setw -g window-status-style "fg=#8a909c,bg=#17181d"
setw -g window-status-format " #I:#W "
setw -g window-status-current-style "fg=#7aa2f7,bg=#17181d,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-activity-style "fg=#f0cf8e,bg=#17181d"

# --- Pane titles -------------------------------------------------------------
# Show the running command above each pane (set to `off` to hide).
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=#7aa2f7],#[fg=#5c6370]}#{pane_index} #{pane_current_command} "

# --- Panes -------------------------------------------------------------------
set -g pane-border-style "fg=#2b3140"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "fg=#d7dae1,bg=#23262e"
set -g message-command-style "fg=#d7dae1,bg=#23262e"
setw -g mode-style "fg=#17181d,bg=#7aa2f7"

# --- Keys --------------------------------------------------------------------
# Prefix stays C-b. Add Vim-style pane movement on top of it.
bind r source-file ~/.tmux.conf \; display-message "config reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Copy mode ---------------------------------------------------------------
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
