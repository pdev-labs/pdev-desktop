# ──────────────────────────────────────────────────────────────────────────
#  hypridle — screen off, lock, suspend
#  Start it from hyprland.lua (the autostart line checks for the binary).
# ──────────────────────────────────────────────────────────────────────────

general {
    lock_cmd = pidof hyprlock || hyprlock 2>>/home/pdev/.cache/hyprlock.log
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({on=true})'
}

# 2.5 min: screen off, but no lock yet (reading a page won't lock you out).
listener {
    timeout = 150
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({on=false})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({on=true})'
}

# 5 min: lock.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 20 min: suspend.
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
