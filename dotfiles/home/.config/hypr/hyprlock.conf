# ──────────────────────────────────────────────────────────────────────────
#  hyprlock — Graphite theme
#  Colours match kitty, Ghostty, Waybar, wofi, starship and tmux.
#  Fonts follow the terminal (JetBrains Mono Nerd Font).
# ──────────────────────────────────────────────────────────────────────────

$font = JetBrainsMono Nerd Font Mono

# Palette
$bg      = rgba(11,16,19,1.0)      # #0b1013
$fg      = rgba(215,218,225,1.0)   # #d7dae1
$muted   = rgba(138,144,156,1.0)   # #8a909c
$accent  = rgba(122,214,224,1.0)   # #7ad6e0
$surface = rgba(23,24,29,0.55)     # #17181d
$red     = rgba(255,123,134,1.0)   # #ff7b86
$yellow  = rgba(240,207,142,1.0)   # #f0cf8e

general {
    hide_cursor = true
    # Don't send an empty password to PAM (no pointless auth attempt on Enter).
    ignore_empty_input = true
    # Draw the background immediately instead of waiting for the first frame.
    immediate_render = true
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, easeOutQuint
    animation = fadeOut, 1, 3, easeOutQuint
    animation = inputFieldDots, 1, 2, easeOutQuint
}

# Blurred, slightly dimmed wallpaper (static image).
# `path = screenshot` was replaced on purpose: screencopy ties the lock surface
# to the live output list, and the virtual PocketDesk display disappearing while
# locked is the most likely reason the lock screen died on tty1.
background {
    monitor =
    path = /home/pdev/wallpaper/jonatan-pie-h8nxGssjQXs-unsplash.jpg
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
    contrast = 1.0
}

# Accent rule above the clock
shape {
    monitor =
    size = 80, 2
    color = $accent
    rounding = 1
    position = 0, 120
    halign = center
    valign = top
}

# Clock
label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 96
    font_family = $font
    position = 0, 150
    halign = center
    valign = top
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $muted
    font_size = 20
    font_family = $font
    position = 0, 268
    halign = center
    valign = top
}

input-field {
    monitor =
    size = 340, 46
    outline_thickness = 2
    rounding = 12

    inner_color = $surface
    outer_color = $accent
    font_color = $fg
    font_family = $font

    # Show the dots (the old config hid all feedback while typing).
    hide_input = false
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false

    placeholder_text = <span foreground="#8a909c">Enter password</span>
    fail_text = <span foreground="#ff7b86">Wrong password</span>
    check_text = <span foreground="#7ad6e0">Verifying…</span>
    capslock_color = $yellow

    position = 0, 90
    halign = center
    valign = center
}

