# ─── Font ────────────────────────────────────────────────────────────────
# JetBrains Mono: the de-facto professional coding font (JetBrains, Google,
# GitHub, many OSS projects). Nerd Font Mono variant = icons stay single-cell
# so starship / eza / lazygit glyphs line up correctly.
font_family         JetBrainsMono Nerd Font Mono
bold_font           auto
italic_font         auto
bold_italic_font    auto
font_size           12.0
# Ligatures (=>, !=, ->) are on by default. Uncomment to turn them off:
# disable_ligatures always

# Word-wise deletion, like GUI editors.
# Ctrl+Backspace -> Ctrl+W   (bash: unix-word-rubout, deletes previous word)
# Ctrl+Delete    -> ESC [3;5~ (bash: kill-word, deletes next word)
map ctrl+backspace send_text all \x17
map ctrl+delete send_text all \e[3;5~

# ─── Performance ──────────────────────────────────────────────────────────
# 1366x768 panel runs at 60 Hz, so there is nothing to gain from repainting
# at kitty's default 100 fps. 16 ms caps it at ~60 fps and cuts GPU wakeups
# during heavy output (builds, logs, `yes`).
sync_to_monitor        yes
repaint_delay          16
# Keystroke latency stays at the default 3 ms for a snappy feel.
input_delay            3
# A solid cursor avoids a repaint every 0.5 s while the terminal is idle.
# Change to 0.5 if you want the blink back.
cursor_blink_interval  0
# No terminal beeps, and no taskbar urgency hints triggered by them.
enable_audio_bell      no
window_alert_on_bell   no

# ─── Scrollback ───────────────────────────────────────────────────────────
# kitty's default is 2000. 3000 keeps build logs around without meaningfully
# growing each window on a 3.8 GB machine; use 5000+ if you prefer more.
scrollback_lines       3000

# ─── Small conveniences ───────────────────────────────────────────────────
# Hide the mouse pointer sooner when typing.
mouse_hide_wait        2.0

# ─── Palette: Graphite ────────────────────────────────────────────────────
# Same values as ~/.config/ghostty/config and the starship "graphite" palette,
# so the terminal, prompt, tmux, Waybar and wofi all share one theme.
foreground              #d7dae1
background              #17181d
selection_foreground    #17181d
selection_background    #7aa2f7
cursor                  #7ad6e0
cursor_text_color       #17181d
url_color               #7ad6e0

active_border_color     #7ad6e0
inactive_border_color   #2b3140
bell_border_color       #f0cf8e

active_tab_foreground   #17181d
active_tab_background   #7aa2f7
inactive_tab_foreground #8a909c
inactive_tab_background #1f2229
tab_bar_background      #17181d

color0  #1f2229
color8  #5c6370
color1  #e06c75
color9  #ff7b86
color2  #98c379
color10 #a9d98a
color3  #e5c07b
color11 #f0cf8e
color4  #61afef
color12 #7cc0ff
color5  #c678dd
color13 #d79ae8
color6  #56b6c2
color14 #7ad6e0
color7  #c8ccd4
color15 #f2f4f8

# ─── Aesthetic ────────────────────────────────────────────────────────────
# 6 px of breathing room on every side (text no longer touches the edges).
window_padding_width 6
# Beam cursor reads better on a dark translucent surface than a solid block.
cursor_shape beam
# Barely-there transparency; keeps text crisp while matching the lock/wofi.
background_opacity 0.96
# Trim trailing spaces on copy, but leave normal lines alone.
strip_trailing_spaces smart

# Thin scrollbar, only when there is history to scroll.
scrollbar_width 4
scrollbar_handle_color #7ad6e0
scrollbar_handle_opacity 0.35
scrollbar_track_color #17181d
scrollbar_radius 2
scrollbar_gap 2
